# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 1
}

# order += "ipv6"
#order += "uptime"
#order += "wireless _first_"
#order += "ethernet _first_"
order += "cpu_usage"
order += "memory"
order += "battery all"
# order += "disk /"
# order += "load"
order += "tztime local"
order += "volume master"

#uptime {
	#path = "/proc/uptime"
#}

cpu_usage {
    format = "CPU %usage"
}

wireless _first_ {
        format_up = "Wi-Fi: %quality"
        format_down = "Wi-Fi: down"
}

ethernet _first_ {
        format_up = "Ethernet: %ip (%speed)"
        format_down = "Ethernet: down"
}

#battery all {
#        format = "%status %percentage %remaining"
#}

battery all {
        format = "%status %percentage %remaining %emptytime"
        format_down = ""
        status_chr = "CHR"
        status_bat = "BAT"
        status_unk = ""
        status_full = "FULL"
        status_idle = "IDLE"
        path = "/sys/class/power_supply/BAT%d/uevent"
        low_threshold = 10
}



#disk "/" {
#        format = "%avail"
#}

#load {
#        format = "%1min"
#}

volume master {
        format = "VOL %volume"
        format_muted = "MUT %volume"
        device = "default"
}

memory {
        format = "MEM %used"
}

tztime local {
        format = "%d.%m.%Y %H:%M"
}
